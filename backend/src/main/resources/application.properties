server.port=${PORT:8080}
spring.application.name=crimson-veil
spring.datasource.url=jdbc:sqlite:${CRIMSON_VEIL_DB:./data/crimson-veil.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
crimson-veil.profile.max-image-bytes=${CRIMSON_VEIL_MAX_PROFILE_IMAGE_BYTES:2097152}
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
logging.level.org.springframework.jdbc.core=INFO

# ==============================================================================
# Integração da IA Narradora — Google Gemini
# ==============================================================================
# A chave GEMINI_API_KEY pode ser informada via variável de ambiente externa ou
# no arquivo local 'backend/.env' (carregado automaticamente na inicialização).
crimson-veil.gemini.api-key=${GEMINI_API_KEY:}

# Configuração central do modelo padrão Gemini utilizado em todo o projeto.
# Para alterar o modelo padrão do sistema, edite este valor ou defina GEMINI_MODEL no backend/.env.
crimson-veil.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Parâmetros de conexão e geração narrativa
crimson-veil.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
crimson-veil.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
crimson-veil.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1000}
crimson-veil.gemini.temperature=${GEMINI_TEMPERATURE:0.7}
