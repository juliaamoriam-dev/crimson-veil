server.port=${PORT:8080}
spring.application.name=crimson-veil
spring.datasource.url=jdbc:sqlite:${CRIMSON_VEIL_DB:./data/crimson-veil.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
logging.level.org.springframework.jdbc.core=INFO
