<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo com neblina de Blackwood -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1322" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#05060a" />
    </radialGradient>

    <!-- Luz carmesim de fundo (iluminação dramática de viaturas/postes) -->
    <radialGradient id="crimsonLight" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#881337" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05060a" stop-opacity="0" />
    </radialGradient>

    <!-- Luz fria de recorte forense -->
    <radialGradient id="forensicLight" cx="75%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05060a" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente do sobretudo noir -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d" />
      <stop offset="45%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0b0d13" />
    </linearGradient>

    <!-- Gradiente de pele dramática noir -->
    <linearGradient id="skinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ebd3c5" />
      <stop offset="50%" stop-color="#d4b4a3" />
      <stop offset="100%" stop-color="#8a6b60" />
    </linearGradient>

    <!-- Cabelo escuro com reflexo carmesim -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c24" />
      <stop offset="60%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Linhas de scanner do terminal -->
    <pattern id="scanlines" width="400" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="400" y2="2" stroke="#000" stroke-width="1" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="400" height="480" fill="url(#bgGlow)" />
  <rect width="400" height="480" fill="url(#crimsonLight)" />
  <rect width="400" height="480" fill="url(#forensicLight)" />

  <!-- Detalhes arquitetônicos de Blackwood ao fundo (silhuetas de janelas molhadas pela chuva) -->
  <g opacity="0.12">
    <rect x="30" y="40" width="40" height="180" fill="#38bdf8" />
    <rect x="85" y="60" width="35" height="160" fill="#e11d48" />
    <rect x="310" y="30" width="50" height="200" fill="#38bdf8" />
    <line x1="0" y1="180" x2="400" y2="180" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Silhueta dos ombros e sobretudo -->
  <path d="M 60 480 C 65 370 120 330 150 310 L 250 310 C 280 330 335 370 340 480 Z" fill="url(#coatGrad)" />

  <!-- Gola alta levantada do sobretudo noir -->
  <path d="M 130 340 L 160 270 L 185 320 Z" fill="#222531" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3" />
  <path d="M 270 340 L 240 270 L 215 320 Z" fill="#1b1d27" stroke="#e11d48" stroke-width="0.5" stroke-opacity="0.4" />
  <polygon points="175,320 200,370 225,320 200,310" fill="#0d0f15" />

  <!-- Pescoço -->
  <path d="M 175 240 L 175 295 C 185 305 215 305 225 295 L 225 240 Z" fill="url(#skinGrad)" />
  <!-- Sombra sob o queixo -->
  <path d="M 175 240 C 190 260 210 260 225 240 L 225 255 C 205 270 195 270 175 255 Z" fill="#694d45" opacity="0.6" />

  <!-- Rosto / Cabeça -->
  <path d="M 155 160 C 155 240 180 260 200 260 C 220 260 245 240 245 160 C 245 100 225 90 200 90 C 175 90 155 100 155 160 Z" fill="url(#skinGrad)" />

  <!-- Olhos atentos e expressivos (Investigadora) -->
  <!-- Olho esquerdo -->
  <path d="M 170 165 Q 183 158 193 165 Q 183 170 170 165 Z" fill="#ffffff" opacity="0.85" />
  <circle cx="182" cy="164" r="4" fill="#1c2438" />
  <circle cx="183" cy="163" r="1.5" fill="#38bdf8" />
  <circle cx="184" cy="162" r="0.8" fill="#ffffff" />
  <path d="M 166 156 Q 182 150 196 156" stroke="#2c1a16" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Olho direito -->
  <path d="M 207 165 Q 217 158 230 165 Q 217 170 207 165 Z" fill="#ffffff" opacity="0.85" />
  <circle cx="218" cy="164" r="4" fill="#1c2438" />
  <circle cx="217" cy="163" r="1.5" fill="#e11d48" opacity="0.9" />
  <circle cx="218" cy="162" r="0.8" fill="#ffffff" />
  <path d="M 204 156 Q 218 150 234 156" stroke="#2c1a16" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Nariz elegante em traço minimalista -->
  <path d="M 200 162 L 197 195 L 204 196" stroke="#8a6054" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- Lábios determinados -->
  <path d="M 188 220 Q 200 216 212 220" stroke="#993d4c" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 191 221 Q 200 227 209 221" stroke="#b04354" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Cabelo moderno com corte médio e mechas sobre a têmpora -->
  <path d="M 152 165 C 145 125 160 80 200 80 C 240 80 255 125 248 165 C 242 205 248 250 240 260 C 235 240 238 200 234 180 C 220 140 185 140 168 180 C 160 210 162 250 156 260 C 150 240 155 190 152 165 Z" fill="url(#hairGrad)" />
  <!-- Mechas soltas na frente -->
  <path d="M 165 95 Q 185 130 174 190" stroke="#252936" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 235 95 Q 215 130 224 190" stroke="#351a24" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Iluminação lateral de recorte carmesim no ombro esquerdo -->
  <path d="M 68 480 C 72 385 115 345 145 320" stroke="#e11d48" stroke-width="2.5" fill="none" opacity="0.75" />
  <!-- Iluminação lateral fria azul forense no ombro direito -->
  <path d="M 332 480 C 328 385 285 345 255 320" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.65" />

  <!-- Detalhe do broche ou distintivo discreto na lapela -->
  <polygon points="145,340 152,345 145,355 138,345" fill="#f59e0b" stroke="#fff" stroke-width="0.5" />
  <circle cx="145" cy="347" r="1.5" fill="#e11d48" />

  <!-- Textura de scanlines sobreposta -->
  <rect width="400" height="480" fill="url(#scanlines)" pointer-events="none" />

  <!-- Efeito vinheta e moldura sutil -->
  <rect x="0" y="0" width="400" height="480" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.3" />
</svg>
